<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { width: 320px; font-family: system-ui, sans-serif; margin: 0; padding: 12px; }
  h1 { font-size: 14px; margin: 0 0 8px; }
  button { font-size: 13px; padding: 6px 10px; cursor: pointer; }
  #send-current { width: 100%; margin-bottom: 10px; }
  ul { list-style: none; margin: 0; padding: 0; max-height: 280px; overflow-y: auto; }
  li { padding: 8px 6px; border-bottom: 1px solid #eee; cursor: pointer; font-size: 13px; }
  li:hover { background: #f5f5f5; }
  li .title { display: block; font-weight: 500; }
  li .url { display: block; color: #666; font-size: 11px; word-break: break-all; }
  #empty { color: #888; font-size: 13px; padding: 8px 0; }
  #footer { margin-top: 8px; text-align: right; }
  #footer a { font-size: 11px; color: #666; }
</style>
</head>
<body>
  <h1>Link Bridge</h1>
  <button id="send-current">Send current tab</button>
  <ul id="inbox"></ul>
  <div id="empty" style="display:none">No links waiting.</div>
  <div id="footer"><a href="#" id="open-options">Settings</a></div>
  <script src="popup.js"></script>
</body>
</html>
