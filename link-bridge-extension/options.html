<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font-family: system-ui, sans-serif; max-width: 420px; margin: 24px auto; }
  label { display: block; margin-top: 12px; font-size: 13px; font-weight: 500; }
  input[type=text], input[type=password] { width: 100%; padding: 6px; font-size: 13px; box-sizing: border-box; }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 12px; }
  button { margin-top: 16px; padding: 8px 14px; font-size: 13px; cursor: pointer; }
  #status { margin-top: 10px; font-size: 12px; color: #0F6E56; }
</style>
</head>
<body>
  <h2>Link Bridge settings</h2>
  <label for="relayUrl">Relay URL (e.g. https://relay.yourdomain)</label>
  <input type="text" id="relayUrl" placeholder="https://relay.example">
  <label for="apiToken">API token</label>
  <input type="password" id="apiToken">
  <div class="row">
    <input type="checkbox" id="autoOpen">
    <label style="margin:0" for="autoOpen">Open received links automatically instead of queuing them</label>
  </div>
  <button id="save">Save</button>
  <div id="status"></div>
  <script src="options.js"></script>
</body>
</html>
